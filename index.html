<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      height: 100vh;
      overflow: hidden;
      margin-top: 40px;
    }
    #output {
        white-space: pre-wrap;
        margin-top: 20px;
      }

    #eyes {
      display: flex;
      gap: 60px;
    }

    .eye {
      position: relative;
      width: 50px;
      height: 50px;
      background: #fff;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: inset 0 0 8px rgba(0,0,0,0.4);
    }

    .pupil {
      position: absolute;
      width: 20px;
      height: 20px;
      background: #000;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      transition: transform 0.05s linear;
    }

    .eyelid {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #111;
      transform-origin: top;
      transform: scaleY(0);
      transition: transform 0.2s ease-in-out;
      border-radius: 50%;
    }

    .eyelid.closed {
      transform: scaleY(1);
    }

    /* When AI is talking, eyes widen slightly */
    .speaking .pupil {
      transform: translate(-50%, -50%) scale(1.3);
    }
  </style>
</head>
<body>
  <div id="eyes">
    <div class="eye" id="left-eye">
      <div class="eyelid"></div>
      <div class="pupil" id="left-pupil"></div>
    </div>
    <div class="eye" id="right-eye">
      <div class="eyelid"></div>
      <div class="pupil" id="right-pupil"></div>
    </div>
  </div>

  <script>
    const leftPupil = document.getElementById('left-pupil');
    const rightPupil = document.getElementById('right-pupil');
    const pupils = [leftPupil, rightPupil];

    let target = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
    let current = { x: target.x, y: target.y };
    const smoothing = 0.12;
    const maxOffset = 20;

    window.addEventListener("mousemove", (e) => {
      target.x = e.clientX;
      target.y = e.clientY;
    });

    function animateEyes() {
      current.x += (target.x - current.x) * smoothing;
      current.y += (target.y - current.y) * smoothing;

      pupils.forEach((pupil) => {
        const rect = pupil.parentElement.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;

        const dx = current.x - centerX;
        const dy = current.y - centerY;
        const angle = Math.atan2(dy, dx);
        const distance = Math.min(maxOffset, Math.hypot(dx, dy));
        const offsetX = Math.cos(angle) * distance;
        const offsetY = Math.sin(angle) * distance;

        pupil.style.transform = `translate(calc(-50% + ${offsetX}px), calc(-50% + ${offsetY}px))`;
      });

      requestAnimationFrame(animateEyes);
    }
    animateEyes();

    function blink() {
      document.querySelectorAll(".eyelid").forEach(lid => {
        lid.classList.add("closed");
        setTimeout(() => lid.classList.remove("closed"), 200);
      });
    }
    setInterval(blink, 4000 + Math.random() * 2000);

    // 🧩 Connect to backend WebSocket
    const ws = new WebSocket("ws://localhost:8081");

    ws.onmessage = (event) => {
      const msg = JSON.parse(event.data);
      if (msg.type === "ai_chunk") {
        document.body.classList.add("speaking");
        // little flicker while “talking”
        pupils.forEach(p => p.style.transform += ` rotate(${Math.random() * 10 - 5}deg)`);
      }
      if (msg.type === "ai_complete") {
        document.body.classList.remove("speaking");
      }
    };
  </script>
</body>
</html>
