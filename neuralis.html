<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AIRIS Command Interface</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      color: #f5f5f7;
      user-select: none;
    }

    /* === macOS side panel (same language as the chatbot) === */
    .panel {
      position: fixed;
      top: 0;
      right: -420px;
      width: 420px;
      height: 100%;
      background: rgba(30, 30, 32, 0.88);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      backdrop-filter: blur(24px) saturate(160%);
      border-left: 1px solid rgba(255,255,255,0.12);
      box-shadow: -12px 0 40px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: right 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .panel-title, .panel > .panel-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #98989d; font-weight: 600; }

    .panel.active { right: 0; }

    #inputBox {
      width: 80%;
      height: 100px;
      padding: 10px;
      font-size: 15px;
      font-family: inherit;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.3);
      color: #f5f5f7;
      border: 1px solid rgba(255, 255, 255, 0.12);
      resize: none;
      outline: none;
      user-select: text;
      transition: border-color .15s, box-shadow .15s;
    }

    #inputBox:focus {
      border-color: rgba(10, 132, 255, 0.8);
      box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.3);
    }

    button {
      padding: 9px 18px;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, opacity 0.15s ease;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }

    #askButton {
      background: #0a84ff;
      color: #fff;
    }

    #askButton:hover { background: #409cff; }

    #micButton {
      background: #30d158;
      color: #062b12;
    }

    #micButton:hover { background: #52e08a; }

    #closeButton {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(255, 255, 255, 0.1);
      color: #f5f5f7;
      border: none;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      font-size: 15px;
      line-height: 28px;
      text-align: center;
      cursor: pointer;
      font-weight: 400;
      transition: background 0.15s ease, transform 0.15s ease;
      box-shadow: none;
    }

    #closeButton:hover {
      background: #ff453a;
      color: #fff;
      transform: scale(1.06);
    }

    #statusText {
      color: #98989d;
      font-size: 13px;
      text-align: center;
      user-select: text;
    }
    .listening {
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="panel" id="panel">
    <div id="closeButton">×</div>
    <textarea id="inputBox" placeholder="Type your command..."></textarea>
    <div style="display:flex;gap:8px;">
      <button id="askButton">🚀 Ask AIRIS</button>
      <button id="micButton">🎙️ Speak</button>
    </div>
    <p id="statusText"></p>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    const panel = document.getElementById('panel');
    const inputBox = document.getElementById('inputBox');
    const askButton = document.getElementById('askButton');
    const closeButton = document.getElementById("closeButton");
    const micButton = document.getElementById('micButton');
    const statusText = document.getElementById('statusText');
  
    let isRecording = false;
  
    // Slide panel in
    setTimeout(() => panel.classList.add('active'), 100);
  
    // Close button
    closeButton.addEventListener("click", () => {
      hidePanel();
    });

    // Helper: smoothly hide and close panel
    function hidePanel() {
      panel.classList.remove("active");
      setTimeout(() => window.close(), 400);
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") hidePanel();
    });
  
    // Helper: detect whether it's an automation command or AI query
    function isAutomationCommand(text) {
      const automationKeywords = [
        "open", "search", "click", "scroll", "navigate", "play", "close tab", "type", "download"
      ];
      return automationKeywords.some(word => text.toLowerCase().includes(word));
    }
  
    askButton.addEventListener("click", async () => {
      const text = inputBox.value.trim();
      if (!text) return (statusText.textContent = "Type or say something first!");

      askButton.disabled = true;
      micButton.disabled = true;
      try {
        statusText.textContent = "🧠 Processing...";
        
        const result = await ipcRenderer.invoke("Neuralis-ai", text);

        if (result && typeof result === "object" && result.type === "error") {
          statusText.textContent = "⚠️ " + (result.output || "Unknown error.");
          askButton.disabled = false;
          micButton.disabled = false;
          return; // keep the panel open on errors
        }

        const responseText = result && typeof result === "object" ? result.output : String(result ?? "");
        ipcRenderer.send("show-sentiment-message", responseText);
        statusText.textContent = "✅ Response received — shown in the bottom-right toast. Type another command, or press Esc to close.";
        // The panel stays open as a toggle now — re-enable the controls so
        // the user can send another command without reopening.
        askButton.disabled = false;
        micButton.disabled = false;

      } catch (err) {
        console.error(err);
        statusText.textContent = "❌ Error executing command.";
        inputBox.value += `\n\n⚠️ Error: ${err.message || err}`;
        askButton.disabled = false;
        micButton.disabled = false;
      }
    });

  
    // Handle speech updates
    ipcRenderer.on('speech-status', (event, msg) => {
      if (msg.startsWith('✅ Transcribed:')) {
        const text = msg.replace('✅ Transcribed:', '').trim();
        if (text) {
          inputBox.value += (inputBox.value ? '\n' : '') + text;
          inputBox.scrollTop = inputBox.scrollHeight;
        }
        statusText.textContent = '✅ Transcribed and appended.';
      } else {
        statusText.textContent = msg;
      }

      if (msg.includes('Speak now')) {
        micButton.classList.add('listening');
      } else {
        micButton.classList.remove('listening');
      }
    });

    // Enter to send
    inputBox.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        askButton.click();
      }
    });
  
    // Mic toggle
    micButton.addEventListener('click', async () => {
      try {
        micButton.disabled = true;
        if (!isRecording) {
          isRecording = true;
          micButton.textContent = "🛑 Stop";
          statusText.textContent = "🎙️ Listening...";
          await ipcRenderer.invoke('toggle-speech', 'start');
        } else {
          isRecording = false;
          micButton.textContent = "🎙️ Speak";
          statusText.textContent = "🕑 Processing...";
          await ipcRenderer.invoke('toggle-speech', 'stop');
        }
      } catch (err) {
        console.error(err);
        statusText.textContent = "❌ Error: " + (err.message || err);
        micButton.textContent = "🎙️ Speak";
        isRecording = false;
      } finally {
        micButton.disabled = false;
      }
    });

  </script>
  
</body>
</html>
