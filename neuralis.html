<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AIRIS Command Interface</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent; /* transparent window */
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
    }

    .panel {
      position: fixed;
      top: 0;
      right: -420px; /* start off-screen */
      width: 420px;
      height: 100%;
      background: rgba(20, 20, 20, 0.85);
      backdrop-filter: blur(12px);
      box-shadow: -4px 0 20px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: right 0.4s ease-in-out;
    }

    .panel.active {
      right: 0; /* slide in */
    }

    #inputBox {
      width: 80%;
      height: 100px;
      padding: 10px;
      font-size: 16px;
      border-radius: 8px;
      background: rgba(40, 40, 40, 0.9);
      color: #fff;
      border: none;
      resize: none;
      outline: none;
      box-shadow: inset 0 0 6px rgba(0, 0, 0, 0.5);
    }

    #askButton {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: #0af;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    #askButton:hover {
      background: #09f;
    }
    #closeButton {
    position: absolute;
    top: 12px;
    left: 12px;
    background: rgba(255, 100, 200, 0.2);
    color: #ffb6c1;
    border: 1px solid #ff99cc;
    border-radius: 50%;
    width: 32px;
    height: 32px;
    font-size: 18px;
    line-height: 30px;
    text-align: center;
    cursor: pointer;
    transition: all 0.25s ease-in-out;
    box-shadow: 0 0 8px #ff69b4;
  }
  #closeButton:hover {
    background: rgba(255, 100, 200, 0.4);
    box-shadow: 0 0 12px #ffb6c1, 0 0 20px #ff69b4;
    transform: scale(1.1);
  }
  </style>
</head>
<body>
  <div class="panel" id="panel">
    <div id="closeButton">×</div>
    <textarea id="inputBox" placeholder="Type your command..."></textarea>
    <button id="askButton">🚀 Ask AIRIS</button>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    const panel = document.getElementById('panel');
    const inputBox = document.getElementById('inputBox');
    const askButton = document.getElementById('askButton');
    const closeButton = document.getElementById("closeButton");
    // Animate in
    setTimeout(() => panel.classList.add('active'), 100);
    closeButton.addEventListener("click", () => {
      panel.classList.remove("active");
      setTimeout(() => window.close(), 400);
    });
    async function sendToAIRIS() {
      const text = inputBox.value.trim();
      if (!text) return alert("Type something first!");
    
      // Disable button to prevent spamming, but keep input usable
      askButton.disabled = true;
    
      try {
        const response = await ipcRenderer.invoke('Neuralis-ai', text);
        alert("AIRIS says: " + response);
        // Auto-close the window after 2 seconds
        setTimeout(() => {
          window.close();
        }, 2000);
      } catch (err) {
        console.error(err);
        alert("Error contacting AIRIS.");
      } finally {
        askButton.disabled = false;
        inputBox.value = '';      // clear after sending
        inputBox.focus();          // refocus so user can type again
      }
    }
    
    askButton.addEventListener('click', sendToAIRIS);
    inputBox.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendToAIRIS();
      }
    });
  </script>
</body>
</html>
