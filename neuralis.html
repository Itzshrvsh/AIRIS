<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AIRIS Command Interface</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      color: #f5f5f7;
      user-select: none;
    }

    /* === macOS side panel (same language as the chatbot) === */
    .panel {
      position: fixed;
      top: 0;
      right: -420px;
      width: 420px;
      height: 100%;
      background: rgba(30, 30, 32, 0.88);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      backdrop-filter: blur(24px) saturate(160%);
      border-left: 1px solid rgba(255,255,255,0.12);
      box-shadow: -12px 0 40px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: right 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .panel-title, .panel > .panel-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #98989d; font-weight: 600; }

    .panel.active { right: 0; }

    #inputBox {
      width: 80%;
      height: 100px;
      padding: 10px;
      font-size: 15px;
      font-family: inherit;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.3);
      color: #f5f5f7;
      border: 1px solid rgba(255, 255, 255, 0.12);
      resize: none;
      outline: none;
      user-select: text;
      transition: border-color .15s, box-shadow .15s;
    }

    #inputBox:focus {
      border-color: rgba(10, 132, 255, 0.8);
      box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.3);
    }

    button {
      padding: 9px 18px;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, opacity 0.15s ease;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }

    #askButton {
      background: #0a84ff;
      color: #fff;
    }

    #askButton:hover { background: #409cff; }

    #micButton {
      background: #30d158;
      color: #062b12;
    }

    #micButton:hover { background: #52e08a; }

    #closeButton {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(255, 255, 255, 0.1);
      color: #f5f5f7;
      border: none;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      font-size: 15px;
      line-height: 28px;
      text-align: center;
      cursor: pointer;
      font-weight: 400;
      transition: background 0.15s ease, transform 0.15s ease;
      box-shadow: none;
    }

    #closeButton:hover {
      background: #ff453a;
      color: #fff;
      transform: scale(1.06);
    }

    #statusText {
      color: #98989d;
      font-size: 13px;
      text-align: center;
      user-select: text;
    }
    .listening {
      animation: pulse 1s infinite;
    }

    #stopButton {
      background: rgba(255, 255, 255, 0.12);
      color: #f5f5f7;
    }
    #stopButton:hover:not(:disabled) { background: #ff453a; color: #fff; }
    #stopButton:disabled { opacity: 0.4; cursor: default; }

    /* Plan rule: one row per planned step, streamed by the main process */
    #planList {
      width: 80%;
      max-height: 260px;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 8px;
      display: none;
      font-size: 12.5px;
      font-family: "SF Mono", "Cascadia Code", Consolas, monospace;
      user-select: text;
    }
    #planList::-webkit-scrollbar { width: 8px; }
    #planList::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.25); border-radius: 6px; }
    .plan-step {
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 3px 4px;
      color: #e5e5ea;
      line-height: 1.45;
      word-break: break-word;
    }
    .plan-step .mark { flex: 0 0 auto; opacity: 0.9; }
    .plan-step.pending .mark { color: #98989d; }
    .plan-step.done { color: rgba(48, 209, 88, 0.95); }
    .plan-step.fail { color: #ff453a; }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="panel" id="panel">
    <div id="closeButton">×</div>
    <div class="panel-title">AIRIS Neuralis</div>
    <textarea id="inputBox" placeholder="Tell NEURALIS what to do — an app, a site, or an email..."></textarea>
    <div style="display:flex;gap:8px;">
      <button id="askButton">🚀 Run</button>
      <button id="micButton">🎙️ Speak</button>
      <button id="stopButton" disabled>🛑 Stop</button>
    </div>
    <p id="statusText"></p>
    <div id="planList" aria-live="polite"></div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    const panel = document.getElementById('panel');
    const inputBox = document.getElementById('inputBox');
    const askButton = document.getElementById('askButton');
    const micButton = document.getElementById('micButton');
    const stopButton = document.getElementById('stopButton');
    const closeButton = document.getElementById("closeButton");
    const statusText = document.getElementById('statusText');
    const planList = document.getElementById('planList');
  
    let isRecording = false;
  
    // Slide panel in
    setTimeout(() => panel.classList.add('active'), 100);
  
    // Close button
    closeButton.addEventListener("click", () => {
      hidePanel();
    });

    // Helper: smoothly hide and close panel
    function hidePanel() {
      // Closing while a plan runs should also stop it.
      if (!stopButton.disabled) ipcRenderer.send('neuralis-abort');
      panel.classList.remove("active");
      setTimeout(() => window.close(), 400);
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") hidePanel();
    });
  
    // ─── Plan-and-execute flow ───────────────────────────────────────
    // The main process streams each planned step; one row per step.
    function addStepRow(step, index) {
      const row = document.createElement('div');
      row.className = 'plan-step pending';
      row.id = `plan-step-${index}`;
      const mark = document.createElement('span');
      mark.className = 'mark';
      mark.textContent = '⏳';
      const label = document.createElement('span');
      const arg = step.target ?? step.text ?? (step.keys ? step.keys.join('+') : step.command ?? step.key ?? `${step.ms ?? ""}ms`);
      label.textContent = `${index + 1}. ${step.action}: ${String(arg).slice(0, 120)}`;
      row.appendChild(mark);
      row.appendChild(label);
      planList.appendChild(row);
      planList.scrollTop = planList.scrollHeight;
    }

    function updateStepRow(index, ok, detail, say = false) {
      const row = document.getElementById(`plan-step-${index}`);
      if (!row) return;
      row.classList.remove('pending');
      row.classList.add(ok ? 'done' : 'fail');
      row.querySelector('.mark').textContent = ok ? '✅' : '❌';
      if (say) {
        // narration steps show their text inline
        row.querySelector('span:last-child').textContent = `💬 ${detail || ''}`;
      }
      planList.scrollTop = planList.scrollHeight;
    }
  
    askButton.addEventListener("click", async () => {
      const text = inputBox.value.trim();
      if (!text) return (statusText.textContent = "Type or say something first!");

      askButton.disabled = true;
      micButton.disabled = true;
      stopButton.disabled = false;
      inputBox.disabled = true;
      statusText.textContent = "🧠 Planning...";
      planList.innerHTML = "";
      planList.style.display = "block";

      // Live progress from the main process
      const onPlan = (_e, plan) => {
        (plan.steps || []).forEach((step, i) => addStepRow(step, i));
      };
      const onStep = (_e, r) => {
        updateStepRow(r.index, r.ok, r.detail, r.ok && r.action === "say" && !!r.detail);
        if (r.ok && r.action === "say" && r.detail) statusText.textContent = r.detail;
        if (!r.ok) statusText.textContent = `❌ Stop: ${r.detail || "step failed"}`;
      };
      ipcRenderer.on('neuralis-plan', onPlan);
      ipcRenderer.on('neuralis-step', onStep);
  
      try {
        const result = await ipcRenderer.invoke("Neuralis-plan", text);

        if (result && typeof result === "object" && !result.ok) {
          if (result.aborted) {
            statusText.textContent = "🛑 Automation stopped.";
          } else {
            statusText.textContent = "⚠️ " + (result.error || "Automation failed.");
            planList.style.display = result.error?.includes("plan") ? "none" : planList.style.display;
          }
        } else {
          statusText.textContent = "✅ Automation complete.";
        }
        // no auto-close: the panel is a toggle, user can run another command
      } catch (err) {
        console.error(err);
        statusText.textContent = "❌ Error executing command.";
        inputBox.value += `\n\n⚠️ Error: ${err.message || err}`;
      } finally {
        ipcRenderer.removeListener('neuralis-plan', onPlan);
        ipcRenderer.removeListener('neuralis-step', onStep);
        askButton.disabled = false;
        micButton.disabled = false;
        stopButton.disabled = true;
        inputBox.disabled = false;
        inputBox.focus();
        inputBox.scrollTop = inputBox.scrollHeight;
      }
    });

    // 🛑 Stop mid-plan → next step is refused in the main process
    stopButton.addEventListener("click", () => {
      ipcRenderer.send('neuralis-abort');
      stopButton.disabled = true;
      statusText.textContent = "🛑 Stopping after current step...";
    });

  
    // Handle speech updates
    ipcRenderer.on('speech-status', (event, msg) => {
      if (msg.startsWith('✅ Transcribed:')) {
        const text = msg.replace('✅ Transcribed:', '').trim();
        if (text) {
          inputBox.value += (inputBox.value ? '\n' : '') + text;
          inputBox.scrollTop = inputBox.scrollHeight;
        }
        statusText.textContent = '✅ Transcribed and appended.';
      } else {
        statusText.textContent = msg;
      }

      if (msg.includes('Speak now')) {
        micButton.classList.add('listening');
      } else {
        micButton.classList.remove('listening');
      }
    });

    // Enter to send
    inputBox.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        askButton.click();
      }
    });
   
    // Mic toggle
    micButton.addEventListener('click', async () => {
      try {
        micButton.disabled = true;
        if (!isRecording) {
          isRecording = true;
          micButton.textContent = "🛑 Stop";
          statusText.textContent = "🎙️ Listening...";
          await ipcRenderer.invoke('toggle-speech', 'start');
        } else {
          isRecording = false;
          micButton.textContent = "🎙️ Speak";
          statusText.textContent = "🕑 Processing...";
          await ipcRenderer.invoke('toggle-speech', 'stop');
        }
      } catch (err) {
        console.error(err);
        statusText.textContent = "❌ Error: " + (err.message || err);
        micButton.textContent = "🎙️ Speak";
        isRecording = false;
      } finally {
        micButton.disabled = false;
      }
    });

  </script>
  
</body>
</html>
