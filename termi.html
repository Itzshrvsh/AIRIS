<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AIRIS Mechanical Terminal</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: #f5f5f7;
    user-select: none;
  }

  /* Sliding macOS side panel */
  .panel {
    position: fixed;
    top: 0;
    right: -460px;
    width: 460px;
    height: 100%;
    box-sizing: border-box;
    background: rgba(24, 24, 26, 0.92);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    backdrop-filter: blur(24px) saturate(160%);
    border-left: 1px solid rgba(255,255,255,0.12);
    box-shadow: -12px 0 40px rgba(0, 0, 0, 0.5);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    color: #f5f5f7;
    transition: right 0.45s cubic-bezier(0.25, 1, 0.3, 1);
    z-index: 1000;
  }
  .panel.active {
    right: 0;
  }

  /* Header with title + close button (keeps the button off the input) */
  #header {
    width: 90%;
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .panel-title {
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #98989d;
    opacity: 0.9;
    font-weight: 600;
  }
  #closeButton {
    flex: 0 0 auto;
    background: rgba(255, 255, 255, 0.1);
    color: #f5f5f7;
    border: none;
    border-radius: 50%;
    width: 28px;
    height: 28px;
    font-size: 15px;
    line-height: 28px;
    text-align: center;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.15s ease;
    box-shadow: none;
  }
  #closeButton:hover {
    background: #ff453a;
    color: #fff;
    transform: scale(1.06);
  }

  /* Input area */
  #inputBox {
    width: 90%;
    height: 100px;
    padding: 10px;
    font-size: 14px;
    font-family: "SF Mono", "Cascadia Code", Consolas, monospace;
    border-radius: 8px;
    background: rgba(0, 0, 0, 0.3);
    color: #f5f5f7;
    border: 1px solid rgba(255, 255, 255, 0.12);
    resize: none;
    outline: none;
    user-select: text;
    transition: border-color .15s, box-shadow .15s;
  }
  #inputBox:focus {
    border-color: rgba(10, 132, 255, 0.8);
    box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.3);
  }

  #askButton {
    margin-top: 12px;
    padding: 9px 18px;
    border: none;
    border-radius: 8px;
    background: #0a84ff;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s ease;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
  }
  #askButton:hover {
    background: #409cff;
  }

  #output {
    width: 90%;
    height: 50%;
    background: rgba(0, 0, 0, 0.25);
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    margin-top: 15px;
    font-family: "SF Mono", "Cascadia Code", Consolas, monospace;
    font-size: 13px;
    color: #d1d1d6;
    overflow-y: auto;
    white-space: pre-wrap;
    padding: 10px;
    user-select: text;
    cursor: text;
  }
  #output::-webkit-scrollbar { width: 8px; }
  #output::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.25); border-radius: 6px; }

  .loader {
    margin-top: 8px;
    color: #98989d;
    font-style: italic;
    animation: blink 1s infinite;
  }
  @keyframes blink { 50% { opacity: 0.3; } }
</style>
</head>
<body>
  <div class="panel" id="panel">
    <div id="header">
      <div id="closeButton" title="Close (Esc)">×</div>
      <div class="panel-title">AIRIS Terminal</div>
    </div>
    <textarea id="inputBox" placeholder="Type your command..."></textarea>
    <button id="askButton">⚙ Generate</button>
    <div id="output"></div>
  </div>

  <script>
    const panel = document.getElementById("panel");
    const inputBox = document.getElementById("inputBox");
    const askButton = document.getElementById("askButton");
    const outputBox = document.getElementById("output");
    const closeButton = document.getElementById("closeButton");

    // Slide in automatically
    setTimeout(() => panel.classList.add("active"), 100);

    // Manual close
    function closePanel() {
      panel.classList.remove("active");
      setTimeout(() => window.close(), 400);
    }
    closeButton.addEventListener("click", closePanel);
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closePanel();
    });

    async function askAI() {
      const userText = inputBox.value.trim();
      if (!userText) return;
      appendOutput("> " + userText + "\n");
      inputBox.value = "";
      askButton.disabled = true;

      const loader = document.createElement("div");
      loader.classList.add("loader");
      loader.textContent = "🚀 Synthesizing CMD sequence...";
      outputBox.appendChild(loader);
      outputBox.scrollTop = outputBox.scrollHeight;

      const prompt = `
You are AIRIS, a mechanical AI that generates **exact Windows terminal commands (CMD or PowerShell)** from user instructions.

Rules:
- Windows commands only (CMD default).
- Return ONE command only, no text, explanations, symbols, or formatting.
- Use '\\\\' for paths; quote paths with spaces.
- If admin required, prepend 'Run as Administrator:'.
- If unsafe, impossible, or unclear, respond only: "🤖 Unable to generate command".
Instruction: ${userText}
      `;

      try {
        // AI goes through the main process / central AI configuration —
        // no renderer-side endpoint or model hard-coding, works offline-safe.
        const result = await window.electronAPI.aiConfig.chat({
          messages: [{ role: "user", content: prompt }],
          maxTokens: 200,
        });

        loader.remove();

        if (!result.ok) {
          appendOutput("🔥 AI error: " + result.error + "\n");
          return;
        }

        const aiCommand = (result.text || "").trim() || "🤖 No response from AI";
        appendOutput(aiCommand + "\n");

        if (aiCommand.includes("Unable to generate command")) {
          appendOutput("⚠️ Command not executed.\n");
          return;
        }

        runCommand(aiCommand);

      } catch (err) {
        loader.remove();
        appendOutput("🔥 AIRIS crashed: " + (err.message || err) + "\n");
      } finally {
        askButton.disabled = false;
      }
    }

    function appendOutput(text) {
      outputBox.textContent += text;
      outputBox.scrollTop = outputBox.scrollHeight;
    }

    async function runCommand(cmd) {
      try {
        appendOutput("$ " + cmd + "\n");
        const result = await window.electronAPI.runCommand(cmd);
        appendOutput(result + "\n⚡ Command completed.\n");
      } catch (err) {
        appendOutput("\n🔥 Fatal: " + (err.message || err) + "\n");
      }
    }

    askButton.addEventListener("click", askAI);
    inputBox.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        askAI();
      }
    });
  </script>
</body>
</html>
