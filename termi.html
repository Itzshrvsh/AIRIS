<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AIRIS Mechanical Terminal</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: 'Courier New', monospace;
  }

  /* Sliding futuristic panel */
  .panel {
    position: fixed;
    top: 0;
    right: -460px;
    width: 460px;
    height: 100%;
    background: linear-gradient(45deg, rgba(26, 13, 26, 0.9), rgba(55, 0, 60, 0.85));
    backdrop-filter: blur(10px);
    box-shadow: -4px 0 20px rgba(0, 0, 0, 0.7);
    border-left: 2px solid #000;
    border-right: 2px solid #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    color: #e0c0ff;
    transition: right 0.45s cubic-bezier(0.25, 1, 0.3, 1);
    z-index: 1000;
  }
  .panel.active {
    right: 0;
  }

  /* Close button */
  #closeButton {
    position: absolute;
    top: 12px;
    left: 12px;
    background: rgba(255, 100, 200, 0.2);
    color: #ffb6c1;
    border: 1px solid #ff99cc;
    border-radius: 50%;
    width: 32px;
    height: 32px;
    font-size: 18px;
    line-height: 30px;
    text-align: center;
    cursor: pointer;
    transition: all 0.25s ease-in-out;
    box-shadow: 0 0 8px #ff69b4;
  }
  #closeButton:hover {
    background: rgba(255, 100, 200, 0.4);
    box-shadow: 0 0 12px #ffb6c1, 0 0 20px #ff69b4;
    transform: scale(1.1);
  }

  /* Input area */
  #inputBox {
    width: 90%;
    height: 100px;
    padding: 10px;
    font-size: 15px;
    border-radius: 8px;
    background: rgba(40, 40, 40, 0.9);
    color: #e0c0ff;
    border: 1px solid #782ec2;
    resize: none;
    outline: none;
    box-shadow: inset 0 0 6px rgba(0, 0, 0, 0.5);
  }
  #inputBox:focus {
    border-color: #c4b700;
  }

  #askButton {
    margin-top: 12px;
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(135deg, #ff66cc, #aa88ff);
    color: #000;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 0 6px #ffb6c1;
  }
  #askButton:hover {
    background: linear-gradient(135deg, #ff99dd, #c0aaff);
    transform: translateY(-1px);
  }

  #output {
    width: 90%;
    height: 50%;
    background: rgba(15, 10, 20, 0.7);
    border-radius: 6px;
    border: 1px solid #333;
    margin-top: 15px;
    font-family: Consolas, monospace;
    font-size: 13px;
    color: #dda0dd;
    overflow-y: auto;
    white-space: pre-wrap;
    padding: 10px;
  }

  .loader {
    margin-top: 8px;
    color: #ffb6c1;
    font-style: italic;
    animation: blink 1s infinite;
  }
  @keyframes blink { 50% { opacity: 0.3; } }
</style>
</head>
<body>
  <div class="panel" id="panel">
    <div id="closeButton">×</div>
    <textarea id="inputBox" placeholder="Type your command..."></textarea>
    <button id="askButton">⚙ Generate</button>
    <div id="output"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script>
    const panel = document.getElementById("panel");
    const inputBox = document.getElementById("inputBox");
    const askButton = document.getElementById("askButton");
    const outputBox = document.getElementById("output");
    const closeButton = document.getElementById("closeButton");

    // Slide in automatically
    setTimeout(() => panel.classList.add("active"), 100);

    // Manual close
    closeButton.addEventListener("click", () => {
      panel.classList.remove("active");
      setTimeout(() => window.close(), 400);
    });

    async function askAI() {
      const userText = inputBox.value.trim();
      if (!userText) return;
      appendOutput("> " + userText + "\n");
      inputBox.value = "";

      const loader = document.createElement("div");
      loader.classList.add("loader");
      loader.textContent = "🚀 Synthesizing CMD sequence...";
      outputBox.appendChild(loader);
      outputBox.scrollTop = outputBox.scrollHeight;

      const prompt = `
You are AIRIS, a mechanical AI that generates **exact Windows terminal commands (CMD or PowerShell)** from user instructions.

Rules:
- Windows commands only (CMD default).
- Return ONE command only, no text, explanations, symbols, or formatting.
- Use '\\\\' for paths; quote paths with spaces.
- If admin required, prepend 'Run as Administrator:'.
- If unsafe, impossible, or unclear, respond only: "🤖 Unable to generate command".
Instruction: ${userText}
      `;

      try {
        const res = await axios.post("http://localhost:11434/api/generate", {
          model: "llava",
          prompt: prompt,
          stream: false
        });

        loader.remove();

        const aiCommand = res.data?.response?.trim() || "🤖 No response from AI";
        appendOutput(aiCommand + "\n");
        runCommand(aiCommand);

      } catch (err) {
        loader.remove();
        appendOutput("🔥 AIRIS crashed: " + (err.message || err) + "\n");
      }
    }

    function appendOutput(text) {
      outputBox.textContent += text;
      outputBox.scrollTop = outputBox.scrollHeight;
    }

    async function runCommand(cmd) {
      try {
        appendOutput("$ " + cmd + "\n");
        const result = await window.electronAPI.runCommand(cmd);
        appendOutput(result + "\n⚡ Command completed.\n");
      } catch (err) {
        appendOutput("\n🔥 Fatal: " + (err.message || err) + "\n");
      }
    }

    askButton.addEventListener("click", askAI);
    inputBox.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        askAI();
      }
    });
  </script>
</body>
</html>
