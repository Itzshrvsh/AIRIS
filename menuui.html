<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AIRIS Dropdown Drawer (Upward)</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: transparent;
  overflow: hidden;
  pointer-events: auto;
}

/* === Floating trigger === */
#trigger {
  width: 180px;
  height: 60px;
  background: rgba(10, 25, 47, 0.95);
  border-radius: 12px;
  position: fixed;
  bottom: 20px;
  left: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-weight: 600;
  color: white;
  cursor: pointer;
  box-shadow: 0 0 15px rgba(10, 25, 47, 0.6),
              inset 0 0 8px rgba(255,255,255,0.2);
  transition: all 0.25s ease;
  backdrop-filter: blur(6px);
  z-index: 2;
}

#trigger:hover {
  transform: scale(1.05);
  background: rgb(10, 25, 47);
  box-shadow: 0 0 20px rgba(10, 25, 47, 0.9);
}

/* === Drawer (slides upward above trigger) === */
#drawer {
  position: fixed;
  left: 20px;
  bottom: calc(20px + 60px + 10px); /* trigger bottom + height + gap */
  width: 180px;
  background: rgba(10, 25, 47, 0.96);
  border-radius: 12px;
  padding: 8px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.4);
  display: none;
  flex-direction: column;
  pointer-events: auto;
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 0.25s ease, transform 0.25s ease;
  z-index: 3;
}

.drawer-item {
  background: rgba(255,255,255,0.08);
  color: white;
  padding: 10px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-family: "Segoe UI", sans-serif;
  font-size: 14px;
  user-select: none;
  margin-bottom: 6px;
  transition: background 0.2s, transform 0.2s;
  outline: none;
}
.drawer-item:last-child { margin-bottom: 0; }

.drawer-item:hover {
  background: rgba(3,169,244,0.9);
  transform: translateX(4px);
}
.drawer-item:focus-visible {
  background: rgba(3,169,244,0.75);
  box-shadow: 0 0 0 2px rgba(255,255,255,0.7);
}
.drawer-item:active {
  background: rgba(2,136,209,0.95);
}

/* Highlight the settings entry as a distinct action */
.drawer-item.settings-item {
  background: rgba(255,255,255,0.14);
  border-top: 1px solid rgba(255,255,255,0.12);
  margin-top: 4px;
  padding-top: 10px;
}
.drawer-item.settings-item:hover { background: rgba(3,169,244,0.95); }
</style>
</head>
<body>
  <div id="trigger" role="button" tabindex="0" aria-expanded="false" aria-controls="drawer">🧠 Start</div>
  <div id="drawer" role="menu" aria-label="AIRIS actions"></div>

<script>
const { ipcRenderer } = require('electron');
const trigger = document.getElementById('trigger');
const drawer = document.getElementById('drawer');

const actions = [
  { name: 'Highlight & Explain', action: 'highlightExplain' },
  { name: 'Patch Content', action: 'contentPatch' },
  { name: 'Chatbot', action: 'chatbot' },
  { name: 'Terminal', action: 'terminal' },
  { name: 'Screen Capture', action: 'screenCapture' },
  { name: 'YouTube Summary', action: 'ytSummary' },
  { name: 'NEURALIS', action: 'neuralis' },
  { name: '⌨ Shortcuts & Help', action: 'help', help: true },
  { name: '⚙️ AI Settings', action: 'aiSettings', settings: true }
];

// Build drawer items
function buildDrawer() {
  drawer.innerHTML = '';
  actions.forEach(act => {
    const item = document.createElement('div');
    item.classList.add('drawer-item');
    if (act.settings) item.classList.add('settings-item');
    item.textContent = act.name;
    item.setAttribute('role', 'menuitem');
    item.setAttribute('tabindex', '0');
    const activate = () => {
      if (act.settings) {
        ipcRenderer.send('open-ai-settings');
        hideDrawer();
      } else if (act.help) {
        ipcRenderer.send('open-help');
        hideDrawer();
      } else {
        ipcRenderer.send('menu-action', act.action);
        // Only hide drawer for non-chatbot actions
        if (act.action !== 'chatbot') hideDrawer();
        else hideDrawer(); // chatbot keeps the input window open, drawer still hides
      }
    };
    item.addEventListener('click', activate);
    item.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        activate();
      }
    });
    drawer.appendChild(item);
  });
}
buildDrawer();

// Drawer animations
function showDrawer() {
  drawer.style.display = 'flex';
  trigger.setAttribute('aria-expanded', 'true');
  setTimeout(() => {
    drawer.style.opacity = '1';
    drawer.style.transform = 'translateY(0)';
  }, 10);
}

function hideDrawer() {
  drawer.style.opacity = '0';
  drawer.style.transform = 'translateY(10px)';
  trigger.setAttribute('aria-expanded', 'false');
  setTimeout(() => { drawer.style.display = 'none'; }, 250);
}

// Keyboard: open the drawer via Enter/Space on the trigger
trigger.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    if (drawer.style.display === 'none' || !drawer.style.display) showDrawer();
    else hideDrawer();
  }
});

// Hover behavior + keep the main-process inactivity timer alive while the
// pointer is over the trigger/drawer (otherwise the menu closes mid-click).
let hoverTimeout;
let activityPing = null;

function startActivity() {
  ipcRenderer.send('menuui-activity');
  clearInterval(activityPing);
  activityPing = setInterval(() => ipcRenderer.send('menuui-activity'), 3000);
}
function stopActivity() {
  clearInterval(activityPing);
  activityPing = null;
}

trigger.addEventListener('mouseenter', () => {
  clearTimeout(hoverTimeout);
  startActivity();
  showDrawer();
});
trigger.addEventListener('focus', () => {
  startActivity();
  showDrawer();
});
trigger.addEventListener('mouseleave', () => {
  stopActivity();
  hoverTimeout = setTimeout(hideDrawer, 250);
});
drawer.addEventListener('mouseenter', () => {
  clearTimeout(hoverTimeout);
  startActivity();
});
drawer.addEventListener('focusin', startActivity);
drawer.addEventListener('mouseleave', () => {
  stopActivity();
  hoverTimeout = setTimeout(hideDrawer, 250);
});

// Let clicks pass through the transparent parts of the drawer window. The
// window stays interactive while the pointer is over the trigger or drawer.
let lastClickThrough = false;
function setClickThrough(ignore) {
  if (ignore === lastClickThrough) return;
  lastClickThrough = ignore;
  ipcRenderer.send('menuui-ignore', ignore);
}
document.addEventListener('mousemove', (e) => {
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const overUi = Boolean(el && el.closest('#trigger, #drawer'));
  setClickThrough(!overUi);
});
document.addEventListener('mouseleave', () => setClickThrough(true));
</script>
</body>
</html>
