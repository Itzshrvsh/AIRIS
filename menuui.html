<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AIRIS Dropdown Drawer (Upward)</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: transparent;
  overflow: hidden;
  pointer-events: auto;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* === Floating trigger — frosted glass pill === */
#trigger {
  width: 180px;
  height: 44px;
  background: rgba(28, 28, 30, 0.72);
  -webkit-backdrop-filter: blur(24px) saturate(160%);
  backdrop-filter: blur(24px) saturate(160%);
  border: 1px solid rgba(255,255,255,0.14);
  border-radius: 22px;
  position: fixed;
  bottom: 20px;
  left: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  font-weight: 500;
  letter-spacing: 0.01em;
  color: #f5f5f7;
  cursor: pointer;
  box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  transition: transform 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
  z-index: 2;
}

#trigger:hover {
  transform: scale(1.03);
  background: rgba(44, 44, 46, 0.78);
  box-shadow: 0 10px 30px rgba(0,0,0,0.45);
}

/* === Drawer — macOS menu style, slides upward above trigger === */
#drawer {
  position: fixed;
  left: 20px;
  bottom: calc(20px + 44px + 8px); /* trigger bottom + height + gap */
  width: 180px;
  background: rgba(28, 28, 30, 0.8);
  -webkit-backdrop-filter: blur(28px) saturate(160%);
  backdrop-filter: blur(28px) saturate(160%);
  border: 1px solid rgba(255,255,255,0.14);
  border-radius: 14px;
  padding: 6px;
  box-shadow: 0 16px 40px rgba(0,0,0,0.45);
  display: none;
  flex-direction: column;
  pointer-events: auto;
  opacity: 0;
  transform: translateY(10px) scale(0.98);
  transform-origin: bottom left;
  transition: opacity 0.2s ease, transform 0.2s ease;
  z-index: 3;
}

.drawer-item {
  background: transparent;
  color: #f5f5f7;
  padding: 8px 10px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 400;
  user-select: none;
  margin-bottom: 2px;
  transition: background 0.15s ease;
  outline: none;
}
.drawer-item:last-child { margin-bottom: 0; }

.drawer-item:hover {
  background: rgba(10, 132, 255, 0.85);
  color: #fff;
}
.drawer-item:focus-visible {
  background: rgba(10,132,255,0.35);
  box-shadow: 0 0 0 2px rgba(10,132,255,0.6);
}
.drawer-item:active {
  background: rgba(10, 132, 255, 0.95);
}

/* Highlight the settings entry with a menu separator, like macOS */
.drawer-item.settings-item {
  border-top: 1px solid rgba(255,255,255,0.12);
  margin-top: 4px;
  padding-top: 9px;
}
.drawer-item.settings-item:hover { background: rgba(10, 132, 255, 0.85); }
</style>
</head>
<body>
  <div id="trigger" role="button" tabindex="0" aria-expanded="false" aria-controls="drawer">🧠 Start</div>
  <div id="drawer" role="menu" aria-label="AIRIS actions"></div>

<script>
const { ipcRenderer } = require('electron');
const trigger = document.getElementById('trigger');
const drawer = document.getElementById('drawer');

const actions = [
  { name: 'Highlight & Explain', action: 'highlightExplain' },
  { name: 'Patch Content', action: 'contentPatch' },
  { name: 'Chatbot', action: 'chatbot' },
  { name: 'Terminal', action: 'terminal' },
  { name: 'Screen Capture', action: 'screenCapture' },
  { name: 'YouTube Summary', action: 'ytSummary' },
  { name: 'NEURALIS', action: 'neuralis' },
  { name: '⌨ Shortcuts & Help', action: 'help', help: true },
  { name: '⚙️ AI Settings', action: 'aiSettings', settings: true }
];

// Build drawer items
function buildDrawer() {
  drawer.innerHTML = '';
  actions.forEach(act => {
    const item = document.createElement('div');
    item.classList.add('drawer-item');
    if (act.settings) item.classList.add('settings-item');
    item.textContent = act.name;
    item.setAttribute('role', 'menuitem');
    item.setAttribute('tabindex', '0');
    const activate = () => {
      if (act.settings) {
        ipcRenderer.send('open-ai-settings');
        hideDrawer();
      } else if (act.help) {
        ipcRenderer.send('open-help');
        hideDrawer();
      } else {
        ipcRenderer.send('menu-action', act.action);
        // Only hide drawer for non-chatbot actions
        if (act.action !== 'chatbot') hideDrawer();
        else hideDrawer(); // chatbot keeps the input window open, drawer still hides
      }
    };
    item.addEventListener('click', activate);
    item.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        activate();
      }
    });
    drawer.appendChild(item);
  });
}
buildDrawer();

// Drawer animations. The renderer owns visibility: the main process asks it
// to show/hide/toggle via IPC, and hover behavior lives here too. The window
// itself stays alive so the 🧠 Start trigger is always available.
let drawerOpen = false;

function showDrawer() {
  clearTimeout(hoverTimeout);
  drawerOpen = true;
  drawer.style.display = 'flex';
  trigger.setAttribute('aria-expanded', 'true');
  setTimeout(() => {
    drawer.style.opacity = '1';
    drawer.style.transform = 'translateY(0)';
  }, 10);
}

function hideDrawer() {
  clearTimeout(hoverTimeout);
  stopActivity();
  drawerOpen = false;
  drawer.style.opacity = '0';
  drawer.style.transform = 'translateY(10px)';
  trigger.setAttribute('aria-expanded', 'false');
  setTimeout(() => { drawer.style.display = 'none'; }, 250);
}

// Main-process controls: Ctrl+Shift+Z toggles, the inactivity timer hides.
ipcRenderer.on('menuui-show-drawer', () => {
  if (!drawerOpen) { showDrawer(); startActivity(); }
});
ipcRenderer.on('menuui-hide-drawer', () => {
  if (drawerOpen) hideDrawer();
});
ipcRenderer.on('menuui-toggle-drawer', () => {
  if (drawerOpen) hideDrawer();
  else { showDrawer(); startActivity(); }
});

// Keyboard: open the drawer via Enter/Space on the trigger
trigger.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    if (drawer.style.display === 'none' || !drawer.style.display) showDrawer();
    else hideDrawer();
  }
});

// Hover behavior + keep the main-process inactivity timer alive while the
// pointer is over the trigger/drawer (otherwise the menu closes mid-click).
let hoverTimeout;
let activityPing = null;

function startActivity() {
  ipcRenderer.send('menuui-activity');
  clearInterval(activityPing);
  activityPing = setInterval(() => ipcRenderer.send('menuui-activity'), 3000);
}
function stopActivity() {
  clearInterval(activityPing);
  activityPing = null;
}

trigger.addEventListener('mouseenter', () => {
  clearTimeout(hoverTimeout);
  startActivity();
  showDrawer();
});
trigger.addEventListener('focus', () => {
  startActivity();
  showDrawer();
});
trigger.addEventListener('mouseleave', () => {
  stopActivity();
  hoverTimeout = setTimeout(hideDrawer, 250);
});
drawer.addEventListener('mouseenter', () => {
  clearTimeout(hoverTimeout);
  startActivity();
});
drawer.addEventListener('focusin', startActivity);
drawer.addEventListener('mouseleave', () => {
  stopActivity();
  hoverTimeout = setTimeout(hideDrawer, 250);
});

// Let clicks pass through the transparent parts of the drawer window. The
// window starts click-through (set by the main process, matching
// lastClickThrough=true) and the renderer only enables mouse input while
// the pointer is over the trigger or drawer.
let lastClickThrough = true;
function setClickThrough(ignore) {
  if (ignore === lastClickThrough) return;
  lastClickThrough = ignore;
  ipcRenderer.send('menuui-ignore', ignore);
}
document.addEventListener('mousemove', (e) => {
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const overUi = Boolean(el && el.closest('#trigger, #drawer'));
  setClickThrough(!overUi);
});
document.addEventListener('mouseleave', () => setClickThrough(true));
</script>
</body>
</html>
