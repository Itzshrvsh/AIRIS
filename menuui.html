<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AIRIS Dropdown Drawer</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: transparent;
  overflow: hidden;
  pointer-events: auto;
}

/* === Floating brain trigger === */
#trigger {
  width: 180px;
  height: 60px;
  background: rgba(10, 25, 47, 0.95);
  border-radius: 12px;
  position: fixed;
  top: 20px;
  left: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-weight: 600;
  color: white;
  cursor: pointer;
  pointer-events: auto;
  box-shadow: 0 0 15px rgba(10, 25, 47, 0.6),
              inset 0 0 8px rgba(255,255,255,0.2);
  transition: all 0.25s ease;
  backdrop-filter: blur(6px);
  z-index: 2;
}

#trigger:hover {
  transform: scale(1.05);
  background: rgb(10, 25, 47);
  box-shadow: 0 0 20px rgba(10, 25, 47, 0.9);
}

/* === Drawer === */
#drawer {
  position: fixed;
  top: 90px;
  left: 20px;
  width: 180px;
  background: rgba(10, 25, 47, 0.95);
  border-radius: 12px;
  padding: 8px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.4);
  display: none;
  flex-direction: column;
  pointer-events: auto;
  opacity: 0;
  transform: translateY(-10px);
  transition: all 0.25s ease;
  z-index: 3;
}

.drawer-item {
  background: rgba(255,255,255,0.1);
  color: white;
  padding: 10px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-family: "Segoe UI", sans-serif;
  font-size: 14px;
  user-select: none;
  margin-bottom: 6px;
  transition: background 0.2s, transform 0.2s;
}

.drawer-item:last-child { margin-bottom: 0; }

.drawer-item:hover {
  background: rgba(3,169,244,0.9);
  transform: translateX(4px);
}
</style>
</head>
<body>
  <div id="trigger">🧠</div>
  <div id="drawer"></div>

<script>
const { ipcRenderer } = require('electron');
const trigger = document.getElementById('trigger');
const drawer = document.getElementById('drawer');

const actions = [
  { name: 'Highlight & Explain', action: 'highlightExplain' },
  { name: 'Patch Content', action: 'contentPatch' },
  { name: 'Chatbot', action: 'chatbot' },
  { name: 'Terminal', action: 'terminal' },
  { name: 'Screen Capture (Coming Soon...)', action: 'screenCapture' },
  { name: 'YouTube Summary (Under Dev...)', action: 'ytSummary' },
  { name: 'Automate Tasks', action: 'Automate' },
  { name: 'NEURALIS', action: 'neuralis' }
];

// Build drawer items
function buildDrawer() {
  drawer.innerHTML = '';
  actions.forEach(act => {
    const item = document.createElement('div');
    item.classList.add('drawer-item');
    item.textContent = act.name;
    item.addEventListener('click', () => {
      ipcRenderer.send('menu-action', act.action);
      hideDrawer();
    });
    drawer.appendChild(item);
  });
}
buildDrawer();

// Drawer animations
function showDrawer() {
  drawer.style.display = 'flex';
  setTimeout(() => {
    drawer.style.opacity = '1';
    drawer.style.transform = 'translateY(0)';
  }, 10);
}

function hideDrawer() {
  drawer.style.opacity = '0';
  drawer.style.transform = 'translateY(-10px)';
  setTimeout(() => { drawer.style.display = 'none'; }, 250);
}

let hoverTimeout;
trigger.addEventListener('mouseenter', () => {
  clearTimeout(hoverTimeout);
  showDrawer();
});
trigger.addEventListener('mouseleave', () => {
  hoverTimeout = setTimeout(hideDrawer, 250);
});
drawer.addEventListener('mouseenter', () => clearTimeout(hoverTimeout));
drawer.addEventListener('mouseleave', () => {
  hoverTimeout = setTimeout(hideDrawer, 250);
});
</script>
</body>
</html>
