<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AIRIS Dropdown Drawer</title>
<style>


html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: transparent;
  overflow: hidden;
  pointer-events: auto; /* make the base window click-through */
}

#trigger {
  width: 180px;
  height: 60px;
  background: rgba(10, 25, 47, 0.95);
  border-radius: 12px;
  position: fixed;
  top: 20px;
  left: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-weight: 600;
  color: white;
  cursor: pointer;
  pointer-events: auto; /* make only the trigger detect hover */
  box-shadow: 0 0 15px rgba(10, 25, 47, 0.6), inset 0 0 8px rgba(255,255,255,0.2);
  transition: all 0.25s ease;
  backdrop-filter: blur(6px);
  z-index: 2;
}

#trigger:hover {
  transform: scale(1.05);
  background: rgb(10, 25, 47);
  box-shadow: 0 0 20px rgba(10, 25, 47, 0.9);
}

#drawer {
  position: fixed;
  top: 90px;
  left: 20px;
  width: 160px;
  background: rgba(10, 25, 47, 0.95);
  border-radius: 12px;
  padding: 8px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.4);
  display: none;
  flex-direction: column;
  pointer-events: auto; /* drawer clickable */
  opacity: 0;
  transform: translateY(-10px);
  transition: all 0.25s ease;
  z-index: 3;
}


  .drawer-item {
    background: rgba(255,255,255,0.1);
    color: white;
    padding: 10px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-family: "Segoe UI", sans-serif;
    font-size: 14px;
    user-select: none;
    margin-bottom: 6px;
    transition: background 0.2s, transform 0.2s;
  }

  .drawer-item:last-child { margin-bottom: 0; }

  .drawer-item:hover {
    background: rgba(3,169,244,0.9);
    transform: translateX(3px);
  }

  .drawer-item.toggle-on { background: rgba(0,255,0,0.5); }
  .drawer-item.toggle-off { background: rgba(255,0,0,0.5); }

</style>
</head>
<body>
  <div id="trigger">🧠</div>
  <div id="drawer"></div>

<script>
 const { ipcRenderer } = require('electron');

const trigger = document.getElementById('trigger');
const drawer = document.getElementById('drawer');

const actions = [
  { name: 'Highlight & Explain', action: 'highlightExplain' },
  { name: 'Patch Content', action: 'contentPatch' },
  { name: 'Chatbot', action: 'chatbot', toggle: true },
  { name: 'Terminal', action: 'terminal', toggle: true },
  { name: 'Screen Capture (Coming Soon...)', action: 'screenCapture' },
  { name: 'YouTube Summary(Under Development....)', action: 'ytSummary' },
  { name: 'Automate Tasks', action: 'Automate' },
  { name: 'NEURALIS', action: 'neuralis' }
];

const toggleStates = {}; // will be synced with main process

async function buildDrawer() {
  // fetch persistent states from main
  const savedStates = await ipcRenderer.invoke('get-menu-options');
  
  drawer.innerHTML = '';
  actions.forEach(act => {
    const item = document.createElement('div');
    item.classList.add('drawer-item');
    item.textContent = act.name;

    // initialize toggle state from main process
    if (act.toggle) {
      toggleStates[act.action] = savedStates[act.action] ?? false;
      item.classList.toggle('toggle-on', toggleStates[act.action]);
      item.classList.toggle('toggle-off', !toggleStates[act.action]);
    }

    item.addEventListener('click', () => {
      if (act.toggle) {
        toggleStates[act.action] = !toggleStates[act.action];
        item.classList.toggle('toggle-on', toggleStates[act.action]);
        item.classList.toggle('toggle-off', !toggleStates[act.action]);
        ipcRenderer.send('set-menu-option', act.action, toggleStates[act.action]); // persist
      }
      ipcRenderer.send('menu-action', act.action);
    });

    if (act.toggle && !toggleStates[act.action]) item.classList.add('toggle-off');
    drawer.appendChild(item);
  });
}

buildDrawer();


function showDrawer() {
  drawer.style.display = 'flex';
  setTimeout(() => {
    drawer.style.opacity = '1';
    drawer.style.transform = 'translateY(0)';
  }, 10);
}

function hideDrawer() {
  drawer.style.opacity = '0';
  drawer.style.transform = 'translateY(-10px)';
  setTimeout(() => { drawer.style.display = 'none'; }, 250);
}

let hoverTimeout;
trigger.addEventListener('mouseenter', () => {
  clearTimeout(hoverTimeout);
  showDrawer();
});
trigger.addEventListener('mouseleave', () => {
  hoverTimeout = setTimeout(hideDrawer, 250);
});
drawer.addEventListener('mouseenter', () => {
  clearTimeout(hoverTimeout);
  showDrawer();
});
drawer.addEventListener('mouseleave', () => {
  hoverTimeout = setTimeout(hideDrawer, 250);
});

</script>
</body>
</html>
