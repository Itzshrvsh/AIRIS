<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AIRIS Command Interface</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
    }

    /* === Slide-in panel === */
    .panel {
      position: fixed;
      top: 0;
      right: -420px; /* hidden initially */
      width: 420px;
      height: 100%;
      box-sizing: border-box;
      background: rgba(20, 20, 20, 0.85);
      backdrop-filter: blur(12px);
      box-shadow: -4px 0 20px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: right 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .panel-title {
      position: absolute;
      top: 18px;
      left: 20px;
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #8fc7ff;
      opacity: 0.85;
    }

    .panel.active {
      right: 0; /* slide in */
    }

    #inputBox {
      width: 80%;
      height: 100px;
      padding: 10px;
      font-size: 16px;
      border-radius: 8px;
      background: rgba(40, 40, 40, 0.9);
      color: #fff;
      border: none;
      resize: none;
      outline: none;
      box-shadow: inset 0 0 6px rgba(0, 0, 0, 0.5);
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }

    #inputBox:focus {
      box-shadow: 0 0 10px rgba(0, 160, 255, 0.6);
      border: 1px solid #0af;
    }

    #closeButton {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 18px;
      line-height: 30px;
      text-align: center;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }
    #closeButton:hover {
      background: rgba(248, 113, 113, 0.9);
      transform: scale(1.08);
    }

    #askButton {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: #0af;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }

    #askButton:hover {
      background: #09f;
      transform: scale(1.05);
    }

    #loader {
      display: none;
      width: 80%;
      height: 6px;
      border-radius: 100px;
      background: linear-gradient(90deg, #00e0ff, #f441a5, #ffee00, #00e0ff);
      background-size: 400%;
      animation: loader 2s linear infinite;
    }

    @keyframes loader {
      0% { background-position: 0%; }
      100% { background-position: 400%; }
    }

    /* Inline reply area: the panel stays open for follow-up messages. */
    #output {
      width: 80%;
      max-height: 220px;
      overflow-y: auto;
      background: rgba(15, 15, 20, 0.85);
      border-radius: 8px;
      border: 1px solid rgba(0, 160, 255, 0.35);
      font-size: 13px;
      color: #dfeaff;
      white-space: pre-wrap;
      word-wrap: break-word;
      padding: 10px;
      display: none;
    }
    #output::-webkit-scrollbar { width: 8px; }
    #output::-webkit-scrollbar-thumb { background: rgba(0, 160, 255, 0.4); border-radius: 6px; }
  </style>
</head>
<body>
  <div class="panel" id="panel">
    <div class="panel-title">AIRIS Chatbot</div>
    <div id="closeButton" title="Close (Esc)" role="button" aria-label="Close">×</div>
    <textarea id="inputBox" placeholder="Type your command..."></textarea>
    <button id="askButton">🚀 Ask AIRIS</button>
    <div id="loader"></div>
    <div id="output"></div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    const panel = document.getElementById('panel');
    const inputBox = document.getElementById('inputBox');
    const askButton = document.getElementById('askButton');
    const closeButton = document.getElementById('closeButton');
    const loader = document.getElementById('loader');
    const statusText = document.createElement('p');
    statusText.id = 'statusText';
    statusText.setAttribute('role', 'status');
    statusText.style.cssText = 'color:#8fc7ff;font-size:13px;margin:0;min-height:18px;text-align:center;';
    panel.appendChild(statusText);
    const outputBox = document.getElementById('output');

    function appendOutput(text) {
      outputBox.style.display = 'block';
      outputBox.textContent += text + '\n';
      outputBox.scrollTop = outputBox.scrollHeight;
    }

    // Slide in on load
    setTimeout(() => panel.classList.add('active'), 80);

    function closePanel() {
      panel.classList.remove('active');
      setTimeout(() => window.close(), 400);
    }

    closeButton.addEventListener('click', closePanel);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closePanel();
    });

    askButton.addEventListener('click', handleSend);
    inputBox.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    });

    async function handleSend() {
      const text = inputBox.value.trim();
      if (!text) return;

      askButton.disabled = true;
      inputBox.disabled = true;
      loader.style.display = 'block';
      statusText.textContent = '🧠 Thinking...';

      try {
        const response = await ipcRenderer.invoke('ask-ai', text);
        ipcRenderer.send('show-sentiment-message', response);

        // Show the reply inline too and keep the panel OPEN — the window is
        // a toggle: it closes only via × / Esc / the drawer switch. (The old
        // auto-close made every answer a one-shot and forced a full reopen
        // for each follow-up.)
        appendOutput(response);
        statusText.textContent = '✅ Reply shown — send a follow-up, or press Esc to close.';

      } catch (err) {
        console.error('AIRIS Error:', err);
        statusText.textContent = '❌ AIRIS failed — check AI Settings → Test Connection.';
      } finally {
        askButton.disabled = false;
        inputBox.disabled = false;
        inputBox.focus();
        inputBox.scrollTop = inputBox.scrollHeight;
        loader.style.display = 'none';
      }
    }
  </script>
</body>
</html>
