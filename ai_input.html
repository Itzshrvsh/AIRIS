<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AIRIS Command Interface</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
    }

    /* === Slide-in panel === */
    .panel {
      position: fixed;
      top: 0;
      right: -420px; /* hidden initially */
      width: 420px;
      height: 100%;
      background: rgba(20, 20, 20, 0.85);
      backdrop-filter: blur(12px);
      box-shadow: -4px 0 20px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: right 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .panel.active {
      right: 0; /* slide in */
    }

    #inputBox {
      width: 80%;
      height: 100px;
      padding: 10px;
      font-size: 16px;
      border-radius: 8px;
      background: rgba(40, 40, 40, 0.9);
      color: #fff;
      border: none;
      resize: none;
      outline: none;
      box-shadow: inset 0 0 6px rgba(0, 0, 0, 0.5);
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }

    #inputBox:focus {
      box-shadow: 0 0 10px rgba(0, 160, 255, 0.6);
      border: 1px solid #0af;
    }

    #askButton {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: #0af;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }

    #askButton:hover {
      background: #09f;
      transform: scale(1.05);
    }

    #loader {
      display: none;
      width: 80%;
      height: 6px;
      border-radius: 100px;
      background: linear-gradient(90deg, #00e0ff, #f441a5, #ffee00, #00e0ff);
      background-size: 400%;
      animation: loader 2s linear infinite;
    }

    @keyframes loader {
      0% { background-position: 0%; }
      100% { background-position: 400%; }
    }
  </style>
</head>
<body>
  <div class="panel" id="panel">
    <textarea id="inputBox" placeholder="Type your command..."></textarea>
    <button id="askButton">🚀 Ask AIRIS</button>
    <div id="loader"></div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    const panel = document.getElementById('panel');
    const inputBox = document.getElementById('inputBox');
    const askButton = document.getElementById('askButton');
    const loader = document.getElementById('loader');

    // Slide in on load
    setTimeout(() => panel.classList.add('active'), 80);

    askButton.addEventListener('click', handleSend);
    inputBox.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    });

    async function handleSend() {
      const text = inputBox.value.trim();
      if (!text) return;

      askButton.disabled = true;
      inputBox.disabled = true;
      loader.style.display = 'block';

      try {
        const response = await ipcRenderer.invoke('ask-ai', text);
        ipcRenderer.send('show-sentiment-message', response);

        // Slide out and close
        panel.classList.remove('active');
        setTimeout(() => window.close(), 400);

      } catch (err) {
        console.error('AIRIS Error:', err);
        alert('AIRIS malfunction. Try again.');
      } finally {
        loader.style.display = 'none';
        inputBox.value = '';
      }
    }
  </script>
</body>
</html>
