<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      background: rgba(0, 0, 0, 0);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }

    video {
      width: 600px;
      height: auto;
    }
  </style>
</head>
<body>
    <video id="intro" autoplay muted playsinline>
        <source src="startupdadoi.mp4" type="video/mp4">
      </video>
      
      <script>
        const { ipcRenderer } = require('electron');
        const video = document.getElementById("intro");

        // Finish the splash cleanly: on video end OR after a safety timeout
        // (e.g. the video file is missing or autoplay is blocked).
        let finished = false;
        function finish() {
          if (finished) return;
          finished = true;
          video.pause();
          setTimeout(() => ipcRenderer.send("splash-finished"), 1500);
        }
        video.addEventListener("ended", finish);
        video.addEventListener("error", finish);
        setTimeout(finish, 7000);
      </script>
      
</body>
</html>
