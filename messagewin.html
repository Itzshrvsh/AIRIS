<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Meta AI Message</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro", "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      pointer-events: none;
    }
  
    #message-box {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 360px;
      max-width: 90vw;
      background: rgba(28, 28, 30, 0.88);
      color: white;
      padding: 20px 24px;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.15);
      opacity: 0;
      pointer-events: none;
      transform: translateY(120%);
      transition:
        transform 0.6s cubic-bezier(0.25, 1, 0.5, 1),
        opacity 0.4s ease-in-out,
        height 0.3s ease;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      overflow: visible;
    }
  
    #message-box.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }
  
    #message-box.closing {
      transform: translateY(120%);
      opacity: 0;
    }
  
    #window-controls {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
  
    .window-button {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: #ff5f56;
      box-shadow: inset 0 0 1px rgba(0,0,0,0.3);
    }
    .window-button:nth-child(2) { background-color: #ffbd2e; }
    .window-button:nth-child(3) { background-color: #27c93f; }
  
    #message-text {
      font-size: 15px;
      line-height: 1.5;
      margin-top: 10px;
      overflow: visible;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
  
    #progress-bar {
      height: 4px;
      width: 100%;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 100px;
      overflow: hidden;
      margin: 16px 0 8px 0;
    }
  
    #progress-fill {
      height: 100%;
      width: 100%;
      background: #0af;
      animation: shrink 8s linear forwards;
    }

    #message-box.paused #progress-fill {
      animation-play-state: paused;
    }
  
    @keyframes shrink {
      from { width: 100%; }
      to { width: 0%; }
    }
  </style>
</head>
<body>
  <div id="message-box" role="dialog" aria-live="polite" tabindex="0">
    <div id="window-controls">
      <div class="window-button"></div>
      <div class="window-button"></div>
      <div class="window-button"></div>
    </div>
    <span id="message-text">Loading...(might be an error!)</span>
    <div id="progress-bar"><div id="progress-fill"></div></div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    const box = document.getElementById('message-box');
    const textEl = document.getElementById('message-text');
    const progressBar = document.getElementById('progress-bar');
    const progressFill = document.getElementById('progress-fill');
    const sleep = (ms) => new Promise(r => setTimeout(r, ms));

    let flowId = 0; // generation counter — only the newest message may close
    let lastClickThrough = null;

    function setClickThrough(ignore) {
      if (ignore === lastClickThrough) return;
      lastClickThrough = ignore;
      ipcRenderer.send('message-ignore', ignore);
    }

    function adjustHeight() {
      // Let it grow naturally up to 80% of screen height
      box.style.height = "auto";
      const rect = box.getBoundingClientRect();
      const maxHeight = window.innerHeight * 0.8;
      if (rect.height > maxHeight) {
        box.style.height = maxHeight + "px";
        box.style.overflowY = "auto"; // only if message overflows full screen
      } else {
        box.style.overflowY = "visible";
      }
    }

    function restartProgress(ms = 8000) {
      // Restart the shrinking bar for the freshest message. All animation
      // longhands are set inline so duration and pause state stay in sync
      // with the JS countdown (a stylesheet shorthand would override them).
      const p = progressFill;
      p.style.animation = 'none';
      void p.offsetWidth; // reflow to restart keyframes
      p.style.animation = `shrink ${ms}ms linear forwards`;
      p.style.animationPlayState = box.classList.contains('paused') ? 'paused' : 'running';
    }

    async function displayMessageFlow(payload) {
      const sticky = Boolean(payload && typeof payload === "object" && payload.sticky);
      const msg = String(
        payload && typeof payload === "object" ? (payload.text ?? "") : (payload ?? "")
      );
      const myFlow = ++flowId;
      textEl.textContent = msg;
      adjustHeight();

      // Long answers need longer than 8 s. Hovering pauses the countdown
      // (and the progress bar), so the user can scroll/copy at their pace.
      const displayMs = Math.min(30000, Math.max(8000, msg.length * 25));
      if (sticky) {
        // Progress/status messages stay until the next message replaces them
        // (the red dot or Esc can dismiss them manually).
        progressBar.style.display = 'none';
        progressFill.style.animation = 'none';
      } else {
        progressBar.style.display = '';
        restartProgress(displayMs);
      }

      box.classList.remove('closing');
      box.classList.add('show');

      if (sticky) return;

      let remaining = displayMs;
      let lastTick = Date.now();
      while (remaining > 0) {
        await sleep(100);
        if (myFlow !== flowId) return; // a newer message took over — stay open
        const now = Date.now();
        if (!box.classList.contains('paused')) remaining -= now - lastTick;
        lastTick = now;
      }

      box.classList.remove('show');
      box.classList.add('closing');
      await sleep(1000);
      if (myFlow !== flowId) return;
      window.close();
    }
  
    ipcRenderer.on('display-message', async (_, msg) => {
      await displayMessageFlow(msg);
    });

    // Enable interaction (scrollbar, text selection) only while the pointer
    // is over the visible toast; the rest of this full-height window remains
    // click-through.
    document.addEventListener('mousemove', (e) => {
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const overToast = Boolean(el && el.closest('#message-box'));
      setClickThrough(!overToast);
    });
    document.addEventListener('mouseleave', () => setClickThrough(true));

    box.addEventListener('mouseenter', () => {
      setClickThrough(false);
      box.classList.add('paused');
      progressFill.style.animationPlayState = 'paused';
    });
    box.addEventListener('mouseleave', () => {
      box.classList.remove('paused');
      progressFill.style.animationPlayState = 'running';
      setClickThrough(true);
    });
  
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') dismissToast();
    });

    function dismissToast() {
      const myFlow = ++flowId; // cancel any pending auto-close countdown
      box.classList.remove('show');
      box.classList.add('closing');
      setTimeout(() => {
        if (myFlow === flowId) window.close();
      }, 600);
    }

    // The red "traffic light" dot dismisses the toast, including sticky
    // progress messages that would otherwise stay until replaced.
    const closeDot = document.querySelector('#window-controls .window-button');
    if (closeDot) {
      closeDot.title = 'Dismiss';
      closeDot.style.cursor = 'pointer';
      closeDot.addEventListener('click', dismissToast);
    }
  </script>
</body>
</html>
