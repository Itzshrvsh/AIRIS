<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Popup</title>
<style>
  body {
    margin: 0;
    background: rgba(30,30,32,0.95);
    color: white;
    font-family: Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    padding: 10px;
    border-radius: 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);

    /* Smooth fade + slight scale */
    transform: scale(0.95);
    opacity: 0;
    transition: transform 0.3s ease, opacity 0.3s ease;
  }

  body.show {
    opacity: 1;
    transform: scale(1);
  }

  button {
    margin: 5px 0;
    border: none;
    padding: 6px 10px;
    border-radius: 6px;
    background: #007aff;
    color: white;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  button:hover { background: #0af; }
  button:focus-visible { outline: 2px solid #7fd7ff; outline-offset: 1px; }
  button:disabled { opacity: 0.6; cursor: default; }

  #inputBox { display: none; margin-top: 8px; }
  input { width: 100%; padding: 5px; border-radius: 5px; border: none; outline: none; }
  input:focus-visible { outline: 2px solid #7fd7ff; }
</style>
</head>
<body>
  <button id="askAiBtn">Ask AI</button>
  <button id="aiSearchBtn">AI Search</button>

  <div id="inputBox">
    <input id="userQuery" placeholder="Type your question..." />
    <button id="sendBtn">Send</button>
  </div>

<script>
const { ipcRenderer } = require('electron');
const body = document.body;
const askBtn = document.getElementById('askAiBtn');
const searchBtn = document.getElementById('aiSearchBtn');
const sendBtn = document.getElementById('sendBtn');
const queryInput = document.getElementById('userQuery');

const buttons = [askBtn, searchBtn, sendBtn];

// Trigger smooth fade-in on load
window.addEventListener('DOMContentLoaded', () => {
  requestAnimationFrame(() => body.classList.add('show'));
});

function busy() {
  for (const b of buttons) b.disabled = true;
  askBtn.textContent = '⏳ Working...';
}

askBtn.addEventListener('click', () => {
  busy();
  ipcRenderer.send('popup-choice', 'ask-ai');
});

searchBtn.addEventListener('click', () => {
  document.getElementById('inputBox').style.display = 'block';
  askBtn.style.display = 'none';
  searchBtn.style.display = 'none';
  queryInput.focus();
});

sendBtn.addEventListener('click', () => {
  const query = queryInput.value.trim();
  if (!query) return;
  busy();
  ipcRenderer.send('popup-choice', 'ai-search', query);
});

queryInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendBtn.click();
});
</script>
</body>
</html>
